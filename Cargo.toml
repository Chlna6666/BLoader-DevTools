[package]
name = "bloader-devtools"
version = "0.2.2"
edition = "2024"
license = "GPL-3.0-only"
description = "In-process Bedrock native mod developer workspace for BLoader"
authors = ["Chlna6666"]
repository = "https://github.com/Chlna6666/BLoader-DevTools"

[lib]
name = "bloader_devtools"
crate-type = ["cdylib"]

[package.metadata.bl]
mod_id = "bloader.devtools"
mod_name = "BLoader DevTools"
api_version = 1
entry = "bloader_devtools.dll"

[dependencies]
serde_json = "1"
base64 = "0.22"
png = "0.17"
getrandom = "0.3"
iced-x86 = "1.21"
sha2 = "0.10"
egui = "0.35.0"
egui-directx11 = "0.13.0"
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common"
] }
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_LibraryLoader",
  "Win32_Graphics_Gdi",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse"
] }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
panic = "abort"
